name: OSV Scan

on:
  pull_request:
  schedule:
    - cron: '23 15 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --severity=HIGH
      upload-sarif: false

  osv-full:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        --lockfile=pnpm-lock.yaml
        --severity=HIGH
      fail-on-vuln: true
      upload-sarif: false
