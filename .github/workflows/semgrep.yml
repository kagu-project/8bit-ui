name: Semgrep Scan

on:
  pull_request:
  schedule:
    - cron: '11 15 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/semgrep.txt

      - name: Install Semgrep CE
        run: |
          python -m pip install -r .github/requirements/semgrep.txt

      - name: Run Semgrep (error severity gate)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --severity=ERROR \
            --error \
            --metrics=off \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=storybook-static
